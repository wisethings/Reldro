<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Screenshot mockup: AI extracting fields from a claim document">
  <rect width="800" height="450" fill="#F7F4EC"/>
  <defs><clipPath id="win"><rect x="20" y="20" width="760" height="410" rx="14"/></clipPath></defs>
  <rect x="20" y="20" width="760" height="410" rx="14" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"/>
  <g clip-path="url(#win)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="20" y="20" width="760" height="44" fill="#F7F4EC"/>
    <circle cx="44" cy="42" r="6" fill="#E8827A"/><circle cx="64" cy="42" r="6" fill="#EDE3C9"/><circle cx="84" cy="42" r="6" fill="#E4EDD3"/>
    <text x="400" y="47" text-anchor="middle" font-size="14" fill="#6B5A55">Claims Portal — Claim #48213</text>

    <!-- document page, left -->
    <rect x="48" y="90" width="300" height="310" rx="8" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"/>
    <rect x="72" y="116" width="150" height="14" rx="3" fill="#402525"/>
    <rect x="72" y="146" width="252" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="166" width="252" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="186" width="180" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="216" width="252" height="18" rx="3" fill="#FADAD5"/>
    <rect x="72" y="246" width="200" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="266" width="252" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="286" width="252" height="18" rx="3" fill="#FADAD5"/>
    <rect x="72" y="316" width="220" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="336" width="252" height="10" rx="3" fill="#DCD5C6"/>
    <rect x="72" y="356" width="140" height="10" rx="3" fill="#DCD5C6"/>

    <!-- extracted fields panel, right -->
    <rect x="392" y="90" width="336" height="230" rx="10" fill="#F3DDEE" stroke="#8A4A7E" stroke-width="2.5"/>
    <text x="414" y="120" font-size="13" font-weight="600" fill="#402525">AI-extracted fields</text>
    <text x="414" y="152" font-size="12" fill="#6B5A55">Claim ID</text>
    <text x="414" y="172" font-size="14" font-weight="600" fill="#2A0A0C">48213</text>
    <text x="414" y="202" font-size="12" fill="#6B5A55">Repair estimate</text>
    <text x="414" y="222" font-size="14" font-weight="600" fill="#2A0A0C">$6,200 (flagged: 2 estimates on file)</text>
    <text x="414" y="252" font-size="12" fill="#6B5A55">Policy status</text>
    <text x="414" y="272" font-size="14" font-weight="600" fill="#2A0A0C">Active</text>

    <!-- annotation -->
    <rect x="400" y="98" width="320" height="212" rx="8" fill="none" stroke="#A33828" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="392" cy="98" r="16" fill="#A33828"/>
    <text x="392" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">AI</text>
