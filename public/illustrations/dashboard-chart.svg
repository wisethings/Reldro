<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Screenshot mockup: adoption analytics dashboard">
  <rect width="800" height="450" fill="#F7F4EC"/>
  <defs><clipPath id="win3"><rect x="20" y="20" width="760" height="410" rx="14"/></clipPath></defs>
  <rect x="20" y="20" width="760" height="410" rx="14" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"/>
  <g clip-path="url(#win3)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="20" y="20" width="760" height="44" fill="#F7F4EC"/>
    <circle cx="44" cy="42" r="6" fill="#E8827A"/><circle cx="64" cy="42" r="6" fill="#EDE3C9"/><circle cx="84" cy="42" r="6" fill="#E4EDD3"/>
    <text x="400" y="47" text-anchor="middle" font-size="14" fill="#6B5A55">Analytics — This week</text>

    <!-- stat tiles -->
    <rect x="48" y="86" width="215" height="90" rx="10" fill="#F7F4EC" stroke="#DCD5C6" stroke-width="2"/>
    <text x="66" y="114" font-size="12" fill="#6B5A55">Time saved</text>
    <text x="66" y="148" font-size="26" font-weight="700" fill="#2A0A0C">42 hrs</text>

    <rect x="278" y="86" width="215" height="90" rx="10" fill="#F3DDEE" stroke="#8A4A7E" stroke-width="2.5"/>
    <text x="296" y="114" font-size="12" fill="#6B5A55">Adoption</text>
    <text x="296" y="148" font-size="26" font-weight="700" fill="#2A0A0C">68%</text>

    <rect x="508" y="86" width="215" height="90" rx="10" fill="#F7F4EC" stroke="#DCD5C6" stroke-width="2"/>
    <text x="526" y="114" font-size="12" fill="#6B5A55">Value captured</text>
    <text x="526" y="148" font-size="26" font-weight="700" fill="#2A0A0C">$12.4k</text>

    <!-- chart -->
    <rect x="48" y="200" width="675" height="200" rx="10" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"/>
    <line x1="90" y1="360" x2="680" y2="360" stroke="#DCD5C6" stroke-width="2"/>
    <rect x="120" y="300" width="46" height="60" rx="4" fill="#EDE3C9"/>
    <rect x="200" y="270" width="46" height="90" rx="4" fill="#F3DDEE"/>
    <rect x="280" y="240" width="46" height="120" rx="4" fill="#E4EDD3"/>
    <rect x="360" y="290" width="46" height="70" rx="4" fill="#F3DDEE"/>
    <rect x="440" y="230" width="46" height="130" rx="4" fill="#EDE3C9"/>
    <rect x="520" y="255" width="46" height="105" rx="4" fill="#F3DDEE"/>
    <rect x="600" y="220" width="46" height="140" rx="4" fill="#E4EDD3"/>
    <path d="M 143 296 L 223 262 L 303 232 L 383 282 L 463 224 L 543 248 L 623 212" fill="none" stroke="#2A0A0C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- annotation -->
    <rect x="272" y="80" width="227" height="102" rx="14" fill="none" stroke="#A33828" stroke-width="3" stroke-dasharray="7 6"/>
    <rect x="308" y="184" width="154" height="24" rx="12" fill="#FADAD5"/>
    <text x="385" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#A33828">up 12% this week</text>
