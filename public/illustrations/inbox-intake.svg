<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Screenshot mockup: a new request arriving in an inbox queue">
  <rect width="800" height="450" fill="#F7F4EC"/>
  <defs><clipPath id="win-inbox"><rect x="20" y="20" width="760" height="410" rx="14"/></clipPath></defs>
  <rect x="20" y="20" width="760" height="410" rx="14" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"/>
  <g clip-path="url(#win-inbox)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="20" y="20" width="760" height="44" fill="#F7F4EC"/>
    <circle cx="44" cy="42" r="6" fill="#E8827A"/><circle cx="64" cy="42" r="6" fill="#EDE3C9"/><circle cx="84" cy="42" r="6" fill="#E4EDD3"/>
    <text x="400" y="47" text-anchor="middle" font-size="14" fill="#6B5A55">Requests — Inbox</text>

    <g font-size="13" fill="#402525">
      <!-- new item, highlighted -->
      <rect x="52" y="90" width="696" height="70" rx="8" fill="#F3DDEE" stroke="#8A4A7E" stroke-width="2"/>
      <rect x="72" y="108" width="40" height="18" rx="9" fill="#8A4A7E"/>
      <text x="92" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">NEW</text>
      <text x="126" y="118" font-weight="600">Application #10432 — submitted just now</text>
      <text x="126" y="140" font-size="11" fill="#6B5A55">Auto-routed to the underwriting queue</text>

      <!-- older items, plain -->
      <rect x="52" y="172" width="696" height="56" rx="8" fill="#F7F4EC"/>
      <text x="72" y="196" fill="#6B5A55">Application #10428 — in review</text>
      <text x="72" y="214" font-size="11" fill="#8C7F6C">Received yesterday, 4:12pm</text>

      <rect x="52" y="238" width="696" height="56" rx="8" fill="#F7F4EC"/>
      <text x="72" y="262" fill="#6B5A55">Application #10421 — approved</text>
      <text x="72" y="280" font-size="11" fill="#8C7F6C">Received yesterday, 11:03am</text>

      <rect x="52" y="304" width="696" height="56" rx="8" fill="#F7F4EC"/>
      <text x="72" y="328" fill="#6B5A55">Application #10417 — approved</text>
      <text x="72" y="346" font-size="11" fill="#8C7F6C">Received Monday, 2:47pm</text>
    </g>

    <!-- annotation on the new item -->
    <rect x="44" y="82" width="712" height="86" rx="10" fill="none" stroke="#A33828" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="44" cy="82" r="16" fill="#A33828"/>
    <text x="44" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">AI</text>
  </g>
</svg>
